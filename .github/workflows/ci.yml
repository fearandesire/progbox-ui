name: CI

on:
  push:
    branches: [ main, dev ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main, dev ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    # Spec parity with ubuntu-latest, which gives public repos 4 vCPU / 16GB.
    runs-on: ubicloud-standard-4
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Keep in sync with package.json "packageManager" (pnpm@x.y.z)
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Test (Vitest coverage)
        run: pnpm --filter web test:coverage

  api:
    # Compiles the C++ engine and pip-installs numpy/pandas/scipy.
    runs-on: ubicloud-standard-4
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test (Vitest coverage)
        run: pnpm --filter @progbox/api test:coverage

      - name: Build C++ engine
        run: pnpm run build:engine

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analysis dependencies
        run: pip install -r api/vendor/progbox_cpp/tools/requirements.txt

      - name: Engine smoke test
        run: pnpm run test:api:engine

  e2e-smoke:
    # Runs a real Chromium alongside a Vite server; 2 vCPU gets flaky under contention.
    runs-on: ubicloud-standard-4
    # The browser-install step has wedged for 20m+ on GitHub runners (see runs
    # 32271967860, 32274000045). Bound the damage instead of burning the 6h default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Browser binaries only — the apt libs from --with-deps are NOT in this path,
      # so a cache hit still has to run install-deps below.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Split from the apt step below. Combining them (--with-deps) meant a wedge
      # gave no signal about which half hung; separate steps + timeouts do.
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: npx playwright install chromium

      # Always runs: the apt libs live outside ~/.cache/ms-playwright, so a cache
      # hit still needs them or Chromium won't launch.
      - name: Install Playwright system deps
        timeout-minutes: 5
        run: npx playwright install-deps chromium

      - name: Run Playwright smoke suite
        run: pnpm run test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-artifacts
          path: |
            playwright-report
            test-results
          retention-days: 1
          if-no-files-found: ignore
